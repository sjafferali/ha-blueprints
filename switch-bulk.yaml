
blueprint:
  name: Inovelli VZM31-SN (Z2M) – Full Device Configuration
  description: |
    Configure all exposed settings for Inovelli VZM31-SN Blue Series Dimmer switches via Zigbee2MQTT.
    Select settings from the UI and apply them to one or more devices.
  domain: script
  input:
    target_devices:
      name: Target Switches
      description: Select the devices you want to configure.
      selector:
        entity:
          domain: light
          multiple: true

    mqtt_base_topic:
      name: MQTT Base Topic
      description: Default is "zigbee2mqtt"
      default: zigbee2mqtt
      selector:
        text:

    delay_between_devices:
      name: Delay Between Devices (seconds)
      default: 0.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.1

  dimmingSpeedUpRemote:
      name: dimmingSpeedUpRemote
      default: null
      selector:
        number:
          min: 0
          max: 255
          step: 1
  dimmingSpeedUpLocal:
