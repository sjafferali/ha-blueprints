  defaultLed3ColorWhenOn:
        name: defaultLed3ColorWhenOn
        default: null
        selector:
          selector:
            text:
  defaultLed3ColorWhenOff:
        name: defaultLed3ColorWhenOff
        default: null
        selector:
          selector:
            text:
  defaultLed4ColorWhenOn:
        name: defaultLed4ColorWhenOn
        default: null
        selector:
          selector:
            text:
  defaultLed4ColorWhenOff:
