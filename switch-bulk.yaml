            min: 0
            max: 254
            step: 1
  loadLevelIndicatorTimeout:
        name: loadLevelIndicatorTimeout
        default: null
        selector:
          number:
            min: 0
            max: 255
            step: 1
  autoTimerOff:
        name: autoTimerOff
        default: null
        selector:
          number:
            min: 0
            max: 32767
            step: 1
  brightnessLevelForDoubleTapUp:
