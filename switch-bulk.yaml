      default: null
      selector:
        number:
          min: 0
          max: 255
          step: 1
  defaultLevelLocal:
      name: defaultLevelLocal
      default: null
      selector:
        number:
          min: 0
          max: 254
          step: 1
  defaultLevelRemote:
      name: defaultLevelRemote
