        name: dimmingSpeedUpRemote
        default: null
        selector:
          number:
            min: 0
            max: 255
            step: 1
  dimmingSpeedUpLocal:
        name: dimmingSpeedUpLocal
        default: null
        selector:
          number:
            min: 0
            max: 255
            step: 1
  dimmingSpeedDownRemote:
        name: dimmingSpeedDownRemote
        default: null
        selector:
          number:
            min: 0
            max: 255
            step: 1
  dimmingSpeedDownLocal:
