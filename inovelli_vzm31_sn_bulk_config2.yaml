        # ==================== PREVIEW MODE ====================
        - if:
            - condition: template
              value_template: "{{ preview_mode }}"
          then:
            - choose:
                # Use custom notify service if provided
                - conditions:
                    - condition: template
                      value_template: "{{ use_custom_notify }}"
                  sequence:
                    - service: "{{ notify_service }}"
                      data:
                        title: "🔍 VZM31-SN Preview"
                        message: >
                          **Switch:** {{ device_name }}
                          **Entity:** {{ repeat.item }}

                          {% if change_count | int > 0 %}
                          **📝 {{ change_count }} changes would be applied:**

                          {% for change in changes %}
                          • {{ change }}
                          {% endfor %}
                          {% else %}
                          ✅ **No changes needed** - device already has these settings
                          {% endif %}

                          ---
                          *Preview Mode - No changes applied*
              # Use persistent notification as fallback
              default:
                - service: persistent_notification.create
                  data:
                    title: "🔍 VZM31-SN Preview: {{ device_name }}"
                    message: >
                      **Switch:** {{ device_name }}
                      **Entity:** {{ repeat.item }}

                      {% if change_count | int > 0 %}
