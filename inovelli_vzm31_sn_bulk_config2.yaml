    ramp_rate_on_to_off_remote:
      name: Ramp Rate On to Off (Remote)
      description: Hub turn-off transition speed (0-127, each unit = 100ms, 0 = instant)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    ramp_rate_on_to_off_local:
      name: Ramp Rate On to Off (Local)
      description: Switch turn-on transition speed (0-127, each unit = 100ms, 0 = instant)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    minimum_level:
      name: Minimum Brightness Level
      description: Minimum dimmer level (prevents flickering at low levels)
      default: 1
      selector:
        number:
          min: 1
          max: 254
          mode: slider

    maximum_level:
      name: Maximum Brightness Level
      description: Maximum dimmer level
      default: 255
      selector:
        number:
          min: 2
          max: 255
          mode: slider

    default_level_local:
      name: Default Level (Local)
      description: Default brightness when turned on at switch (0 = last level, 255 = previous)
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    default_level_remote:
      name: Default Level (Remote)
      description: Default brightness when turned on from hub (0 = last level, 255 = previous)
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    button_delay:
      name: Button Press Delay
      description: Delay for button press events (0ms = disables button events)
      default: "500ms"
      selector:
        select:
          options:
            - "0ms"
            - "100ms"
            - "200ms"
            - "300ms"
            - "400ms"
            - "500ms"
            - "600ms"
            - "700ms"
            - "800ms"
            - "900ms"

    single_tap_behavior:
      name: Single Tap Behavior
      description: How single tap up/down operates
      default: "Old Behavior"
      selector:
        select:
          options:
            - "Old Behavior"
            - "New Behavior"
            - "Down Always Off"

    double_tap_up_to_param55:
      name: Double Tap Up Enabled
      description: Enable double-tap UP to set specific brightness
      default: "Enabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    double_tap_down_to_param56:
      name: Double Tap Down Enabled
      description: Enable double-tap DOWN to set specific brightness
      default: "Enabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    brightness_level_for_double_tap_up:
      name: Double Tap Up Brightness
      description: Brightness level for double-tap UP (255 = send ON command)
      default: 255
      selector:
        number:
          min: 2
          max: 255
          mode: slider

    brightness_level_for_double_tap_down:
      name: Double Tap Down Brightness
      description: Brightness level for double-tap DOWN
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    double_tap_clear_notifications:
      name: Double Tap Config to Clear Notifications
      description: Double-tap config button to clear LED notifications
      default: "Enabled (Default)"
      selector:
        select:
          options:
            - "Enabled (Default)"
            - "Disabled"

    output_mode:
      name: Output Mode
      description: Dimmer or On/Off switch mode
      default: "Dimmer"
      selector:
        select:
          options:
            - "Dimmer"
            - "On/Off"

    switch_type:
      name: Switch Type
      description: Wiring configuration
      default: "Single Pole"
      selector:
        select:
          options:
            - "Single Pole"
            - "3-Way Dumb Switch"
            - "3-Way Aux Switch"
            - "Single-Pole Full Sine Wave"

    invert_switch:
      name: Invert Switch
      description: Reverse up/down paddle orientation
      default: "No"
      selector:
        select:
          options:
            - "Yes"
            - "No"

    smart_bulb_mode:
      name: Smart Bulb Mode
      description: Keep power on for smart bulbs
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Smart Bulb Mode"

    led_bar_scaling:
      name: LED Bar Scaling
      description: LED bar display method
      default: "Gen3 method (VZM-style)"
      selector:
        select:
          options:
            - "Gen3 method (VZM-style)"
            - "Gen2 method (LZW-style)"

    on_off_led_mode:
      name: On/Off LED Mode
      description: LED display in On/Off mode
      default: "All"
      selector:
        select:
          options:
            - "All"
            - "One"

    firmware_update_in_progress_indicator:
      name: Firmware Update Indicator
      description: Show progress on LED bar during updates
      default: "Enabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    relay_click:
      name: Relay Click Sound
      description: Audible relay click (neutral on/off setups)
      default: "Disabled (Click Sound On)"
      selector:
        select:
          options:
            - "Disabled (Click Sound On)"
            - "Enabled (Click Sound Off)"

    state_after_power_restored:
      name: State After Power Restored
      description: State when power returns (0=off, 1-254=level, 255=previous)
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    auto_timer_off:
      name: Auto Timer Off
      description: Auto-off timer in seconds (0 = disabled)
      default: 0
      selector:
        number:
          min: 0
          max: 32767
          mode: box
          unit_of_measurement: "s"

    quick_start_time:
      name: Quick Start Time
      description: Full power duration when turning on (in 1/60th second, 0 = disabled)
      default: 0
      selector:
        number:
          min: 0
          max: 60
          mode: slider

    quick_start_level:
      name: Quick Start Level
      description: Power level during quick start
      default: 1
      selector:
        number:
          min: 1
          max: 254
          mode: slider

    local_protection:
      name: Local Protection
      description: Disable physical switch control
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    binding_off_to_on_sync_level:
      name: Binding Off to On Sync Level
      description: Send level to bound devices on OFF/ON
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    aux_switch_unique_scenes:
      name: Aux Switch Unique Scenes
      description: Different scene numbers for aux switch
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    active_power_reports:
      name: Active Power Reports
      description: Power change percentage to trigger report (0 = disabled)
      default: 10
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"

    periodic_power_and_energy_reports:
      name: Periodic Power Reports
      description: Time between reports in seconds (0 = disabled)
      default: 3600
      selector:
        number:
          min: 0
          max: 32767
          mode: box
          unit_of_measurement: "s"

    active_energy_reports:
      name: Active Energy Reports
      description: Energy change to trigger report (0 = disabled, units of 0.01 kWh)
      default: 10
      selector:
        number:
          min: 0
          max: 32767
          mode: box
          unit_of_measurement: "0.01 kWh"

    fan_control_mode:
      name: Fan Control Mode
      description: Fan binding mode for config button (EP3)
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Multi Tap"
            - "Cycle"

    low_level_for_fan_control_mode:
      name: Fan Low Speed Level
      description: Dimmer level for low fan speed
      default: 33
      selector:
        number:
          min: 2
          max: 254
          mode: slider

    medium_level_for_fan_control_mode:
      name: Fan Medium Speed Level
      description: Dimmer level for medium fan speed
      default: 66
      selector:
        number:
          min: 2
          max: 254
          mode: slider

    high_level_for_fan_control_mode:
      name: Fan High Speed Level
      description: Dimmer level for high fan speed
      default: 99
      selector:
        number:
          min: 2
          max: 254
          mode: slider

    led_color_for_fan_control_mode:
      name: LED Color for Fan Mode
      description: LED color when in fan control mode
      default: 127
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    fan_led_level_type:
      name: Fan LED Level Type
      description: How LED bar displays fan speed
      default: 0
      selector:
        number:
          min: 0
          max: 10
          mode: slider

    higher_output_in_non_neutral:
      name: Higher Output in Non-Neutral
      description: Increase output for non-neutral setups
      default: "Disabled (default)"
      selector:
        select:
          options:
            - "Disabled (default)"
            - "Enabled"

    load_level_indicator_timeout:
      name: Load Level Indicator Timeout
      description: How long LED bar shows load level
      default: "3 Seconds"
      selector:
        select:
          options:
            - "Stay Off"
            - "1 Second"
            - "2 Seconds"
            - "3 Seconds"
            - "4 Seconds"
            - "5 Seconds"
            - "6 Seconds"
            - "7 Seconds"
            - "8 Seconds"
            - "9 Seconds"
            - "10 Seconds"
            - "Stay On"

variables:
  target_switches: !input target_switches
  configure_individual_leds: !input configure_individual_leds

sequence:
  - repeat:
      for_each: "{{ target_switches }}"
      sequence:
        - variables:
            device_name: "{{ state_attr(repeat.item, 'friendly_name') | replace(' ', '_') | lower }}"
            base_entity: "{{ repeat.item | replace('light.', '') }}"

        - service: number.set_value
          target:
            entity_id: "number.{{ base_entity }}_ledcolorwhenon"
          data:
            value: !input led_color_when_on

        - service: number.set_value
          target:
            entity_id: "number.{{ base_entity }}_ledcolorwhenoff"
          data:
            value: !input led_color_when_off

        - service: number.set_value
          target:
            entity_id: "number.{{ base_entity }}_ledintensitywhenon"
          data:
            value: !input led_intensity_when_on

        - service: number.set_value
          target:
            entity_id: "number.{{ base_entity }}_ledintensitywhenoff"
          data:
            value: !input led_intensity_when_off

        - if:
            - condition: template
              value_template: "{{ configure_individual_leds }}"
          then:
            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled1colorwhenon"
              data:
                value: !input led1_color_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled1colorwhenoff"
              data:
                value: !input led1_color_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled1intensitywhenon"
              data:
                value: !input led1_intensity_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled1intensitywhenoff"
              data:
                value: !input led1_intensity_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled2colorwhenon"
              data:
                value: !input led2_color_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled2colorwhenoff"
              data:
                value: !input led2_color_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled2intensitywhenon"
              data:
                value: !input led2_intensity_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled2intensitywhenoff"
              data:
                value: !input led2_intensity_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled3colorwhenon"
              data:
                value: !input led3_color_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled3colorwhenoff"
              data:
                value: !input led3_color_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled3intensitywhenon"
              data:
                value: !input led3_intensity_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled3intensitywhenoff"
              data:
                value: !input led3_intensity_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled4colorwhenon"
              data:
                value: !input led4_color_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled4colorwhenoff"
              data:
                value: !input led4_color_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled4intensitywhenon"
              data:
                value: !input led4_intensity_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled4intensitywhenoff"
              data:
                value: !input led4_intensity_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled5colorwhenon"
              data:
                value: !input led5_color_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled5colorwhenoff"
              data:
                value: !input led5_color_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled5intensitywhenon"
              data:
                value: !input led5_intensity_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled5intensitywhenoff"
              data:
                value: !input led5_intensity_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled6colorwhenon"
              data:
                value: !input led6_color_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled6colorwhenoff"
              data:
                value: !input led6_color_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled6intensitywhenon"
              data:
                value: !input led6_intensity_when_on

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled6intensitywhenoff"
              data:
                value: !input led6_intensity_when_off

            - service: number.set_value
              target:
                entity_id: "number.{{ base_entity }}_defaultled7colorwhenon"
              data:
                value: !input led7_color_when_on

