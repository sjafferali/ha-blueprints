                      {% endfor %}
                      {% else %}
                      ✅ **No changes needed** - device already has these settings
                      {% endif %}

                      ---
                      *Preview Mode - No changes applied*

                      To apply changes, disable Preview Mode and run again.
                    notification_id: "vzm31_preview_{{ base_entity }}"

