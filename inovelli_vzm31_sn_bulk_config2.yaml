blueprint:
  name: Inovelli VZM31-SN Bulk Configuration
  description: >
    Apply identical configuration settings to multiple Inovelli VZM31-SN 2-in-1 dimmer switches simultaneously.
    All settings are exposed as blueprint inputs, allowing complete customization of LED behavior, dimming speeds,
    button actions, power reporting, fan control, and more.
  domain: script
  author: Samir Jafferali
  source_url: https://github.com/sjafferali/ha-blueprints
  homeassistant:
    min_version: 2024.1.0

  input:
    # ==================== EXECUTION MODE ====================
    preview_mode:
      name: Preview Mode (Dry Run)
      description: When enabled, shows what WOULD change without applying. Disable to apply changes. Perfect for detecting configuration drift.
      default: true
      selector:
        boolean: {}

    notify_service:
      name: Notification Service (Optional)
      description: Enter the full notify service name (e.g., notify.mobile_app_iphone, notify.telegram, notify.pushover). Leave empty to use persistent notifications (bell icon).
      default: ""
      selector:
        text:

    # ==================== TARGET SELECTION ====================
    target_switches:
      name: Target Switches
      description: Select the VZM31-SN switches to configure (select the light entities)
      selector:
        entity:
          multiple: true
          filter:
            - integration: mqtt
              domain: light

    # ==================== LED SETTINGS - GLOBAL ====================
    led_color_when_on:
      name: LED Color When On
      description: LED bar color when switch is on (0-255)
      default: 170
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    led_color_when_off:
      name: LED Color When Off
      description: LED bar color when switch is off (0-255)
      default: 170
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    led_intensity_when_on:
      name: LED Intensity When On
      description: LED bar brightness when switch is on (0-100%)
      default: 100
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"

    led_intensity_when_off:
      name: LED Intensity When Off
      description: LED bar brightness when switch is off (0-100%)
      default: 10
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"

    configure_individual_leds:
      name: Configure Individual LEDs
      description: Enable individual LED customization (LEDs 1-7)
      default: false
      selector:
        boolean: {}

    led1_color_when_on:
      name: LED 1 Color When On
      description: Color for LED 1 when on (255 = sync with global)
      default: 255
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    led1_color_when_off:
      name: LED 1 Color When Off
      description: Color for LED 1 when off (255 = sync with global)
      default: 255
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    led1_intensity_when_on:
      name: LED 1 Intensity When On
      description: Intensity for LED 1 when on (101 = sync with global)
      default: 101
      selector:
        number:
          min: 0
          max: 101
          mode: slider

    led1_intensity_when_off:
      name: LED 1 Intensity When Off
      description: Intensity for LED 1 when off (101 = sync with global)
      default: 101
      selector:
        number:
          min: 0
          max: 101
          mode: slider

    led2_color_when_on:
      name: LED 2 Color When On
      description: Color for LED 2 when on (255 = sync with global)
      default: 255
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    led2_color_when_off:
      name: LED 2 Color When Off
      description: Color for LED 2 when off (255 = sync with global)
      default: 255
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    led2_intensity_when_on:
      name: LED 2 Intensity When On
      description: Intensity for LED 2 when on (101 = sync with global)
      default: 101
      selector:
        number:
          min: 0
          max: 101
          mode: slider

    led2_intensity_when_off:
      name: LED 2 Intensity When Off
      description: Intensity for LED 2 when off (101 = sync with global)
      default: 101
      selector:
        number:
          min: 0
          max: 101
          mode: slider

    led3_color_when_on:
      name: LED 3 Color When On
      description: Color for LED 3 when on (255 = sync with global)
