    led7_intensity_when_off:
      name: LED 7 Intensity When Off
      description: Intensity for LED 7 when off (101 = sync with global)
      default: 101
      selector:
        number:
          min: 0
          max: 101
          mode: slider

    dimming_speed_up_remote:
      name: Dimming Speed Up (Remote)
      description: Hub-controlled dim-up speed (0-127, each unit = 100ms)
      default: 25
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    dimming_speed_up_local:
      name: Dimming Speed Up (Local)
      description: Switch-controlled dim-up speed (0-127, each unit = 100ms)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    dimming_speed_down_remote:
      name: Dimming Speed Down (Remote)
      description: Hub-controlled dim-down speed (0-127, each unit = 100ms)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    dimming_speed_down_local:
      name: Dimming Speed Down (Local)
      description: Switch-controlled dim-down speed (0-127, each unit = 100ms)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    ramp_rate_off_to_on_remote:
      name: Ramp Rate Off to On (Remote)
      description: Hub turn-on transition speed (0-127, each unit = 100ms, 0 = instant)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    ramp_rate_off_to_on_local:
      name: Ramp Rate Off to On (Local)
      description: Switch turn-on transition speed (0-127, each unit = 100ms, 0 = instant)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    ramp_rate_on_to_off_remote:
      name: Ramp Rate On to Off (Remote)
      description: Hub turn-off transition speed (0-127, each unit = 100ms, 0 = instant)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    ramp_rate_on_to_off_local:
      name: Ramp Rate On to Off (Local)
      description: Switch turn-on transition speed (0-127, each unit = 100ms, 0 = instant)
      default: 127
      selector:
        number:
          min: 0
          max: 127
          mode: slider

    minimum_level:
      name: Minimum Brightness Level
      description: Minimum dimmer level (prevents flickering at low levels)
      default: 1
      selector:
        number:
          min: 1
          max: 254
          mode: slider

    maximum_level:
      name: Maximum Brightness Level
      description: Maximum dimmer level
      default: 255
      selector:
        number:
          min: 2
          max: 255
          mode: slider

    default_level_local:
      name: Default Level (Local)
      description: Default brightness when turned on at switch (0 = last level, 255 = previous)
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    default_level_remote:
      name: Default Level (Remote)
      description: Default brightness when turned on from hub (0 = last level, 255 = previous)
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    button_delay:
      name: Button Press Delay
      description: Delay for button press events (0ms = disables button events)
      default: "500ms"
      selector:
        select:
          options:
            - "0ms"
            - "100ms"
            - "200ms"
            - "300ms"
            - "400ms"
            - "500ms"
            - "600ms"
            - "700ms"
            - "800ms"
            - "900ms"

    single_tap_behavior:
      name: Single Tap Behavior
      description: How single tap up/down operates
      default: "Old Behavior"
      selector:
        select:
          options:
            - "Old Behavior"
            - "New Behavior"
            - "Down Always Off"

    double_tap_up_to_param55:
      name: Double Tap Up Enabled
      description: Enable double-tap UP to set specific brightness
      default: "Enabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    double_tap_down_to_param56:
      name: Double Tap Down Enabled
      description: Enable double-tap DOWN to set specific brightness
      default: "Enabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    brightness_level_for_double_tap_up:
      name: Double Tap Up Brightness
      description: Brightness level for double-tap UP (255 = send ON command)
      default: 255
      selector:
        number:
          min: 2
          max: 255
          mode: slider

    brightness_level_for_double_tap_down:
      name: Double Tap Down Brightness
      description: Brightness level for double-tap DOWN
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    double_tap_clear_notifications:
      name: Double Tap Config to Clear Notifications
      description: Double-tap config button to clear LED notifications
      default: "Enabled (Default)"
      selector:
        select:
          options:
            - "Enabled (Default)"
            - "Disabled"

    output_mode:
      name: Output Mode
      description: Dimmer or On/Off switch mode
      default: "Dimmer"
      selector:
        select:
          options:
            - "Dimmer"
            - "On/Off"

    switch_type:
      name: Switch Type
      description: Wiring configuration
      default: "Single Pole"
      selector:
        select:
          options:
            - "Single Pole"
            - "3-Way Dumb Switch"
            - "3-Way Aux Switch"
            - "Single-Pole Full Sine Wave"

    invert_switch:
      name: Invert Switch
      description: Reverse up/down paddle orientation
      default: "No"
      selector:
        select:
          options:
            - "Yes"
            - "No"

    smart_bulb_mode:
      name: Smart Bulb Mode
      description: Keep power on for smart bulbs
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Smart Bulb Mode"

    led_bar_scaling:
      name: LED Bar Scaling
      description: LED bar display method
      default: "Gen3 method (VZM-style)"
      selector:
        select:
          options:
            - "Gen3 method (VZM-style)"
            - "Gen2 method (LZW-style)"

    on_off_led_mode:
      name: On/Off LED Mode
      description: LED display in On/Off mode
      default: "All"
      selector:
        select:
          options:
            - "All"
            - "One"

    firmware_update_in_progress_indicator:
      name: Firmware Update Indicator
      description: Show progress on LED bar during updates
      default: "Enabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    relay_click:
      name: Relay Click Sound
      description: Audible relay click (neutral on/off setups)
      default: "Disabled (Click Sound On)"
      selector:
        select:
          options:
            - "Disabled (Click Sound On)"
            - "Enabled (Click Sound Off)"

    state_after_power_restored:
      name: State After Power Restored
      description: State when power returns (0=off, 1-254=level, 255=previous)
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    auto_timer_off:
      name: Auto Timer Off
      description: Auto-off timer in seconds (0 = disabled)
      default: 0
      selector:
        number:
          min: 0
          max: 32767
          mode: box
          unit_of_measurement: "s"

    quick_start_time:
      name: Quick Start Time
      description: Full power duration when turning on (in 1/60th second, 0 = disabled)
      default: 0
      selector:
        number:
          min: 0
          max: 60
          mode: slider

    quick_start_level:
      name: Quick Start Level
      description: Power level during quick start
      default: 1
      selector:
        number:
          min: 1
          max: 254
          mode: slider

    local_protection:
      name: Local Protection
      description: Disable physical switch control
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    binding_off_to_on_sync_level:
      name: Binding Off to On Sync Level
      description: Send level to bound devices on OFF/ON
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    aux_switch_unique_scenes:
      name: Aux Switch Unique Scenes
      description: Different scene numbers for aux switch
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Enabled"

    active_power_reports:
      name: Active Power Reports
      description: Power change percentage to trigger report (0 = disabled)
      default: 10
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"

    periodic_power_and_energy_reports:
      name: Periodic Power Reports
      description: Time between reports in seconds (0 = disabled)
      default: 3600
      selector:
        number:
          min: 0
          max: 32767
          mode: box
          unit_of_measurement: "s"

    active_energy_reports:
      name: Active Energy Reports
      description: Energy change to trigger report (0 = disabled, units of 0.01 kWh)
      default: 10
      selector:
        number:
          min: 0
          max: 32767
          mode: box
          unit_of_measurement: "0.01 kWh"

    fan_control_mode:
      name: Fan Control Mode
      description: Fan binding mode for config button (EP3)
      default: "Disabled"
      selector:
        select:
          options:
            - "Disabled"
            - "Multi Tap"
            - "Cycle"

    low_level_for_fan_control_mode:
      name: Fan Low Speed Level
      description: Dimmer level for low fan speed
      default: 33
      selector:
        number:
          min: 2
          max: 254
          mode: slider

    medium_level_for_fan_control_mode:
      name: Fan Medium Speed Level
      description: Dimmer level for medium fan speed
      default: 66
      selector:
        number:
          min: 2
          max: 254
          mode: slider

    high_level_for_fan_control_mode:
      name: Fan High Speed Level
      description: Dimmer level for high fan speed
      default: 99
      selector:
        number:
          min: 2
          max: 254
          mode: slider

    led_color_for_fan_control_mode:
      name: LED Color for Fan Mode
      description: LED color when in fan control mode
      default: 127
      selector:
        number:
          min: 0
          max: 255
          mode: slider

    fan_led_level_type:
      name: Fan LED Level Type
      description: How LED bar displays fan speed
      default: 0
      selector:
        number:
          min: 0
          max: 10
          mode: slider

    higher_output_in_non_neutral:
      name: Higher Output in Non-Neutral
      description: Increase output for non-neutral setups
      default: "Disabled (default)"
      selector:
        select:
          options:
            - "Disabled (default)"
            - "Enabled"

    load_level_indicator_timeout:
      name: Load Level Indicator Timeout
      description: How long LED bar shows load level
      default: "3 Seconds"
      selector:
        select:
          options:
            - "Stay Off"
            - "1 Second"
            - "2 Seconds"
            - "3 Seconds"
            - "4 Seconds"
            - "5 Seconds"
            - "6 Seconds"
            - "7 Seconds"
            - "8 Seconds"
            - "9 Seconds"
            - "10 Seconds"
            - "Stay On"

variables:
  target_switches: !input target_switches
  configure_individual_leds: !input configure_individual_leds
  preview_mode: !input preview_mode
  notify_service: !input notify_service
  use_custom_notify: "{{ notify_service != '' and notify_service != none and notify_service | length > 0 }}"

sequence:
  - repeat:
      for_each: "{{ target_switches }}"
      sequence:
        - variables:
            device_name: "{{ state_attr(repeat.item, 'friendly_name') }}"
            base_entity: "{{ repeat.item | replace('light.', '') }}"
            # Input values
            input_led_color_on: !input led_color_when_on
            input_led_color_off: !input led_color_when_off
            input_led_intensity_on: !input led_intensity_when_on
            input_led_intensity_off: !input led_intensity_when_off
            input_dimming_speed_up_remote: !input dimming_speed_up_remote
            input_dimming_speed_up_local: !input dimming_speed_up_local
            input_dimming_speed_down_remote: !input dimming_speed_down_remote
            input_dimming_speed_down_local: !input dimming_speed_down_local
            input_ramp_rate_off_to_on_remote: !input ramp_rate_off_to_on_remote
            input_ramp_rate_off_to_on_local: !input ramp_rate_off_to_on_local
            input_ramp_rate_on_to_off_remote: !input ramp_rate_on_to_off_remote
            input_ramp_rate_on_to_off_local: !input ramp_rate_on_to_off_local
            input_minimum_level: !input minimum_level
            input_maximum_level: !input maximum_level
            input_default_level_local: !input default_level_local
            input_default_level_remote: !input default_level_remote
            input_button_delay: !input button_delay
            input_single_tap_behavior: !input single_tap_behavior
            input_double_tap_up: !input double_tap_up_to_param55
            input_double_tap_down: !input double_tap_down_to_param56
            input_brightness_double_tap_up: !input brightness_level_for_double_tap_up
            input_brightness_double_tap_down: !input brightness_level_for_double_tap_down
            input_double_tap_clear: !input double_tap_clear_notifications
            input_output_mode: !input output_mode
            input_switch_type: !input switch_type
            input_invert_switch: !input invert_switch
            input_smart_bulb_mode: !input smart_bulb_mode
            input_led_bar_scaling: !input led_bar_scaling
            input_on_off_led_mode: !input on_off_led_mode
            input_firmware_update_indicator: !input firmware_update_in_progress_indicator
            input_relay_click: !input relay_click
            input_state_after_power: !input state_after_power_restored
            input_auto_timer_off: !input auto_timer_off
            input_quick_start_time: !input quick_start_time
            input_quick_start_level: !input quick_start_level
            input_local_protection: !input local_protection
            input_binding_sync: !input binding_off_to_on_sync_level
            input_aux_switch_scenes: !input aux_switch_unique_scenes
            input_active_power_reports: !input active_power_reports
            input_periodic_power_reports: !input periodic_power_and_energy_reports
            input_active_energy_reports: !input active_energy_reports
            input_fan_control_mode: !input fan_control_mode
            input_fan_low_level: !input low_level_for_fan_control_mode
            input_fan_medium_level: !input medium_level_for_fan_control_mode
            input_fan_high_level: !input high_level_for_fan_control_mode
            input_fan_led_color: !input led_color_for_fan_control_mode
            input_higher_output: !input higher_output_in_non_neutral
            input_load_indicator_timeout: !input load_level_indicator_timeout
            # Current values from entities
            current_led_color_on: "{{ states('number.' + base_entity + '_ledcolorwhenon') }}"
            current_led_color_off: "{{ states('number.' + base_entity + '_ledcolorwhenoff') }}"
            current_led_intensity_on: "{{ states('number.' + base_entity + '_ledintensitywhenon') }}"
            current_led_intensity_off: "{{ states('number.' + base_entity + '_ledintensitywhenoff') }}"
            current_dimming_speed_up_remote: "{{ states('number.' + base_entity + '_dimmingspeedupremote') }}"
            current_dimming_speed_up_local: "{{ states('number.' + base_entity + '_dimmingspeeduplocal') }}"
            current_dimming_speed_down_remote: "{{ states('number.' + base_entity + '_dimmingspeeddownremote') }}"
            current_dimming_speed_down_local: "{{ states('number.' + base_entity + '_dimmingspeeddownlocal') }}"
            current_ramp_off_on_remote: "{{ states('number.' + base_entity + '_ramprateofftoonremote') }}"
            current_ramp_off_on_local: "{{ states('number.' + base_entity + '_ramprateofftoonlocal') }}"
            current_ramp_on_off_remote: "{{ states('number.' + base_entity + '_ramprateontooffremote') }}"
            current_ramp_on_off_local: "{{ states('number.' + base_entity + '_ramprateontoofflocal') }}"
            current_minimum_level: "{{ states('number.' + base_entity + '_minimumlevel') }}"
            current_maximum_level: "{{ states('number.' + base_entity + '_maximumlevel') }}"
            current_default_level_local: "{{ states('number.' + base_entity + '_defaultlevellocal') }}"
